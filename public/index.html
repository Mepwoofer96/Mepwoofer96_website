<body class="background">

  <div class="monitor">
    <div class="crt">
      <div class="screen">
        <div class="terminal" id="term">
          <div class="history" id="history"></div>
          <div class="prompt"><span class="ps">:&gt;</span><span class="typed" id="typed"></span><span class="cursor"></span><input id="input" class="capture" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="terminal input"></div>
        </div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="dome" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage id="domeMap" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap id="domeDisp" in="SourceGraphic" in2="map"
                         scale="100" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

<script>
  const map = document.getElementById('domeMap');
  const disp = document.getElementById('domeDisp');
  const screenEl = document.querySelector('.screen');
  const STRENGTH = 0.07;   // how far the edges bow, as a fraction of screen size

  function buildDome() {
    const w = screenEl.clientWidth, h = screenEl.clientHeight, m = Math.max(w, h);

    // one gradient per axis; 128 = no shift, values rise or fall with the cube of the distance from center
    const stops = (amp, ch) => Array.from({ length: 17 }, (_, i) => {
      const u = i / 8 - 1;                                    // -1 .. 1 across the screen
      const v = Math.round(255 * (0.5 + 0.5 * amp * u ** 3));
      const rgb = ch === 'r' ? `${v},0,0` : `0,${v},0`;
      return `<stop offset="${i / 16}" stop-color="rgb(${rgb})"/>`;
    }).join('');

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
      <defs>
        <linearGradient id="x" x1="0" y1="0" x2="1" y2="0">${stops(w / m, 'r')}</linearGradient>
        <linearGradient id="y" x1="0" y1="0" x2="0" y2="1">${stops(h / m, 'g')}</linearGradient>
      </defs>
      <rect width="256" height="256" fill="#000"/>
      <rect width="256" height="256" fill="url(#x)"/>
      <rect width="256" height="256" fill="url(#y)" style="mix-blend-mode:screen"/>
    </svg>`;

    map.setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent(svg));
    disp.setAttribute('scale', 2 * STRENGTH * m);
  }

  buildDome();
  addEventListener('resize', buildDome);
</script>

<script>
  const term    = document.getElementById('term');
  const history = document.getElementById('history');
  const typed   = document.getElementById('typed');
  const input   = document.getElementById('input');

  // click or tap anywhere to type (but tapping a link/button shouldn't pop the keyboard)
  term.addEventListener('click', e => {
    if (!e.target.closest('.tlink')) input.focus();
  });
  input.focus();

  input.addEventListener('input', () => {
    typed.textContent = input.value;                      
  });

// remove the oldest lines until everything fits on screen
function trim() {
  while (history.firstChild && term.scrollHeight > term.clientHeight) {
    history.removeChild(history.firstChild);
  }
}

addEventListener('resize', trim);  

// keep the whole terminal above the on-screen keyboard
if (window.visualViewport) {
  const fit = () => {
    if (visualViewport.scale > 1) return;           
    document.documentElement.style.setProperty('--app-h', visualViewport.height + 'px');
    scrollTo(0, 0);
    trim();
  };
  visualViewport.addEventListener('resize', fit);
  fit();
}

// add one line to the history
function addLine(text) {
  const line = document.createElement('div');
  line.textContent = text;
  history.appendChild(line);
}

// label = text shown, action = a URL string or a function to run on click
function addLink(label, action) {
  const row = document.createElement('div');
  const el = document.createElement(typeof action === 'string' ? 'a' : 'button');
  el.className = 'tlink';
  el.textContent = '[ ' + label + ' ]';
  if (typeof action === 'string') el.href = action;
  else el.addEventListener('click', action);
  row.appendChild(el);
  history.appendChild(row);
}

// banner: ASCII art on wide screens, a plain-text fallback on phones (CSS picks which one shows)
function addArt(id) {
  const box = document.createElement('div');
  box.className = 'art';
  box.textContent = document.getElementById(id).textContent.replace(/^\n|\s+$/g, '');
  history.appendChild(box);

  const small = document.createElement('div');
  small.className = 'art-small';
  small.textContent = document.getElementById('banner-small').textContent.replace(/^\n|\s+$/g, '');
  history.appendChild(small);
}


// ---------- startup sequence ----------
const flashEl  = document.getElementById('flash');
const promptEl = document.querySelector('.prompt');

let skip = false, bootStart = 0;
const sleep = ms => new Promise(r => setTimeout(r, skip ? 0 : ms));
const skipIt = e => { if (e.timeStamp > bootStart) skip = true; };   // any key or tap skips
addEventListener('keydown', skipIt);
addEventListener('pointerdown', skipIt);

// the normal home screen (also used when the animation is skipped)
function showHome() {
  addArt('banner');
  addLine('WELCOME, GUEST.');
  addLine('TYPE "HELP" FOR COMMANDS.');
  if (matchMedia('(pointer: coarse)').matches) addLine('TAP THE SCREEN TO TYPE.');
  addLine('LINK TO PORTFOLIO:');
  addLink('PORTFOLIO', 'portfolio.html');
  trim();
}

function flashScreen() {
  flashEl.classList.remove('go');
  void flashEl.offsetWidth;          // forces a reflow so the animation can restart
  flashEl.classList.add('go');
}


async function typeCmd(text) {
  for (const ch of text) {
    typed.textContent += ch;
    await sleep(35 + Math.random() * 60);
  }
  await sleep(250);
  typed.textContent = '';
  addLine(':> ' + text);
}

const LOADING = [   // [label, how long it "takes" in ms]
  ['KERNEL', 250], ['PHOSPHOR DRIVER', 400], ['SCANLINE GENERATOR', 250],
  ['DOME CALIBRATION', 500], ['NETWORK', 300], ['PORTFOLIO INDEX', 350],
];

async function boot() {
  skip = false; bootStart = performance.now();
  input.disabled = true;
  history.innerHTML = '';
  promptEl.style.visibility = '';

  await sleep(700);                         

  await typeCmd('init');                   
  addLine('CRT CONTROLLER ...... OK');
  await sleep(300);
  await typeCmd('boot --cold');
  await sleep(400);

  flashScreen();                          
  history.innerHTML = '';
  promptEl.style.visibility = 'hidden';
  await sleep(400);

  for (const [label, ms] of LOADING) {       
    const row = document.createElement('div');
    row.textContent = `LOADING ${label} ...`;
    history.appendChild(row);
    trim();
    await sleep(ms);
    row.textContent += ' [OK]';
  }
  await sleep(400);

  history.innerHTML = '';                  
  showHome();
  promptEl.style.visibility = '';
  term.classList.add('warmup');
  await sleep(1800);
  term.classList.remove('warmup');

  input.disabled = false;
  input.focus();
  try { sessionStorage.setItem('booted', '1'); } catch {}
}


const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seen = false;
try { seen = !!sessionStorage.getItem('booted'); } catch {}

if (reduced || seen) showHome();
else boot();



const files = {
  'about.txt':   ['Mepwoofer96 Terminal v0.5.1', 'I forgor'],
  'contact.txt': ['EMAIL: tommybosjr@gmail.com'],
  'projects/':   [null],                      
  'games/': ['dungeon-crawler.exe','home.exe','shadows-of-deceit.exe','your-big-day.exe']
};

const games = {
  'dungeon-crawler.exe':   'games/dungeon-crawler.html',
  'home.exe':              'games/home_advanced.html',
  'shadows-of-deceit.exe': 'games/Shadows-of-Deceit.html',
  'your-big-day.exe':      'games/your_big_day.html',
};

function launch(name) {
  addLine('To exit game press the back button on your browser')
  addLine('OPENING ' + name + '...');
  setTimeout(() => { window.location.href = games[name]; }, 2000);
}

const helps ={
  'help': ['Prints out all of the availible commands.','type "help name" to find out more about the function "name"'],
  'about': ['Prints information about the website'],
  'date': ['Prints out the current date and time'],
  'clear': ['Clears the window of all commands'],
  'page': ['Takes you to a random page'],
  'cat': ['cat is used in conjunction with ls','Use it as cat "file" after finding the files with the function "ls" '],
  'ls': ['Shows all of the files in the current directory'],
  'start': ['Shows the startup screen'],
  'art': ['Prints the startup art of "mepwoofer96.com"'],
  'links': ['Prints links to the other pages of the website'],
  'reboot':['Shows the boot animation'],
  'games' :['lists games','type in run "name of game" to play game '],
  'run'   :['Runs files, run "name of file"'],
  'portfolio':['Goes straight to the portfolio page'],
  'clock':['Goes to a clock page with a 8 segment display'],
}

function date(){
  label = new Date().toLocaleString();
  const row = document.createElement('div');
  row.className = 'clock';
  row.textContent =label;
  history.appendChild(row);
}

// word typed -> lines to print
const commands = {
  about: ['Mepwoofer96 Terminal v0.5.1', 'I forgor'],
  date:  () => [new Date().toLocaleString()], 
  date2: () => date(), 
  clock: () => {
    addLine('OPENING CLOCK...');
    setTimeout(() => { window.location.href = 'clock_8.html'; }, 600);
  }, 
  page: () => window.location.href = "test.html",
  ls: () => Object.keys(files),
  art: () => addArt('banner'),
  links: () => {
    addLine('SELECT A DESTINATION:');
    addLink('PORTFOLIO', 'portfolio.html');                       // a string makes a real link
    addLink('SAY HELLO', () => addLine('HELLO, VISITOR.'));       // a function runs on click
  },
  portfolio: () => {
    addLine('OPENING PORTFOLIO...');
    setTimeout(() => { window.location.href = 'portfolio.html'; }, 600);
  },
  reboot:() => {boot();},
  games: ['dungeon-crawler.exe   home.exe   shadows-of-deceit.exe   your-big-day.exe','Type run "name of game" to play a game'],
};

input.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;

  const raw = input.value;
  const cmd = raw.trim().toLowerCase();        

  input.value = '';                 
  typed.textContent = '';

  addLine(':> ' + raw);             

  const [name, ...args] = cmd.split(/\s+/);

  if (name === 'clear') {
    history.innerHTML = '';

  } else if (name === 'cat') {
    const f = files[args[0]];
    if (f) f.forEach(addLine);
    else addLine('cat: ' + (args[0] || '') + ': NO SUCH FILE');

  }else if (name === 'help'){
      const h = helps[args[0]];
      if (h) h.forEach(addLine);
      else{ 
      addLine('AVAILABLE COMMANDS:');
      addLine('  help   about   date   clear   page   cat   ls   start   art   links   games   reboot   run   portfolio   clock');
      addLine('Type "help name" to find out more about the function "name"')
      }
  } else if (name === 'run') {
    if (Object.hasOwn(games, args[0])) launch(args[0]);
    else addLine('run: ' + (args[0] || '') + ': NO SUCH PROGRAM');

  } else if (Object.hasOwn(games, name)) {  
  launch(name);

  } else if (name in commands) {
    const out = commands[name];
    const lines = typeof out === 'function' ? out() : out;
    if (Array.isArray(lines)) lines.forEach(addLine);

  } else if (cmd) {
    addLine('UNKNOWN COMMAND: ' + cmd.toUpperCase());
    addLine('Type Help for useful commands');
  }

  input.value = '';
  typed.textContent = '';
  trim();
});

addEventListener('pageshow', e => {
  if (e.persisted) {              
    history.innerHTML = '';
    input.value = '';
    typed.textContent = '';
    input.disabled = false;
    input.focus();
    showHome();
  }
});
